[project]
name = "citizen-services-backend"
version = "1.0.0"
description = "Django + DRF backend for the National Citizen Services Portal demo frontend."
readme = "README.md"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Ruff: linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/0*.py"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "DJ",       # flake8-django
    "DTZ",      # naive datetimes
    "SIM",      # simplifications
    "PT",       # pytest style
    "RUF",      # ruff-specific
    "S",        # bandit
    "T20",      # no print()
    "PIE", "RET", "TID",
]
ignore = [
    "RUF012",   # DRF/Django class attributes are intentionally mutable class-level config
    "RUF001", "RUF002", "RUF003",  # Persian digits and the "•" mask character are intentional
    "S105", "S106",                # test passwords / demo password constant are not secrets
    "DJ001",                       # nullable CharFields are deliberate: one table, three roles
    "RET504",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "DTZ001", "PT011"]
"apps/core/demo/**" = ["S311"]
# Catalogue copy is prose in two languages; wrapping it mid-sentence would hurt more than it helps.
"apps/catalog/definitions.py" = ["E501"]
"config/settings/*.py" = ["F403", "F405"]
"manage.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy + django-stubs
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unreachable = true
disallow_subclassing_any = false   # DRF/Django base classes are only partly typed
exclude = ["^apps/.*/migrations/"]

[[tool.mypy.overrides]]
module = "environ"
ignore_missing_imports = true  # django-environ has no stubs

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "apps.*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "concurrency: exercises real row-lock behaviour with several database connections",
]
filterwarnings = [
    "error::RuntimeWarning",
]
